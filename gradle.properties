org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# 本项目所在路径含中文（"Glove-Statistics - 副本"），AGP 默认会因此直接报错终止。
# 这个路径是自己选定的，编译产物本身没问题，所以显式关掉这项检查。
android.overridePathCheck=true

# 关闭 Gradle 文件监视服务：在部分受限环境下它会启动失败并刷一堆 NativeException，
# 对这个体量的项目没有性能影响。
org.gradle.vfs.watch=false

# 在受限环境（沙箱 / 只读的 %LOCALAPPDATA%\kotlin\daemon）里，Kotlin 编译守护进程
# 会连不上，任务直接报 "Could not connect to Kotlin compile daemon"，
# 更麻烦的是有时构建看起来"成功"却复用了旧的 class 产物。
# 改成在 Gradle 进程内编译，避免这种静默的陈旧产物。
kotlin.compiler.execution.strategy=in-process

